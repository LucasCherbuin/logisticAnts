# base de donnée
spring.datasource.url=jdbc:mysql://172.18.0.4:3306/logisticants?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Session
server.servlet.session.tracking-modes=cookie
# Mailer
spring.mail.host=${SPRING_MAILER_HOST}
spring.mail.port=${SPRING_MAILER_PORT}
spring.mail.username=${SPRING_MAILER_USERNAME}
spring.mail.password=${SPRING_MAILER_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# PayPal
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=${PAYPAL_MODE}
# Twint et carte via Datatrans
datatrans.merchant-id=${DATATRANS_MERCHANT_ID}
datatrans.api-key=${DATATRANS_API_KEY}
datatrans.base-url=${DATATRANS_BASE_URL}
transaction.success-url=${TRANSACTION_SUCCESS_URL}
transaction.cancel-url=${TRANSACTION_CANCEL_URL}
frontend.url=${API_FRONTEND_URL}
# MongoDB Atlas (ne pas exclure MongoAutoConfiguration / MongoDataAutoConfiguration)
spring.data.mongodb.uri=${MANGODB_CONNEXION_STRING}
