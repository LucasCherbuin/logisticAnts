# base de donnée
spring.datasource.url=jdbc:mysql://172.18.0.4:3306/logisticants?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration


# Session
server.servlet.session.tracking-modes=cookie

# Mailer
spring.mail.host=${SPRING_MAILER_HOST}
spring.mail.port=${SPRING_MAILER_PORT}
spring.mail.username=${SPRING_MAILER_USERNAME}
spring.mail.password=${SPRING_MAILER_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# PayPal
paypal.client-id=PAYPAL_CLIENT_ID
paypal.client-secret=PAYPAL_CLIENT_SECRET
paypal.mode=sandbox  # ou "live"

# Twint via Datatrans
datatrans.merchant-id=TWINT_MERCHANT_ID
datatrans.api-key=TWINT_API
datatrans.base-url=https://api.datatrans.com/v1

frontend.url=${API_FRONTEND_URL}
