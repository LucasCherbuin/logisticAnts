<div class="search-bar">
    <input
        type="text"
        placeholder="Rechercher un produit"
        [(ngModel)]="searchTerm"
        (input)="onSearch()"
    >
</div>

<div class="card-container">
    <card
        *ngFor="let produit of filteredAnimals"
        [produit]="produit">
    </card>
</div>
