<div>
    <p>votre panier</p>
    <hr>
    <div *ngFor="let item of items$ | async; let i = index">
        {{ item.produit.nom }}
        <select (change)="changeSubtotal(item, i)" #subTotalWrap>
            <option [value]="item.quantite">{{ item.quantite }}</option>
        </select>
        {{ item.produit.prix | currency:'CHF' }}
        <button (click)="deleteFromCart(item.produit)"><i class="ph ph-trash"></i> Supprimer</button>
    </div>
    <hr>
    <p>frais d'expédition</p><p>10 chf</p>
    <hr>
    <p>Total : {{ total | currency:'CHF' }}</p>
    <button routerLink="/purchase">Passez en caisse</button>
    <hr>
</div>
