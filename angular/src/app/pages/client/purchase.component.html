<div>
    <div>
        <h3>Moyen de paiement</h3>
        <div>
            <input type="radio" id="facture" name="payement" value="Facture" [(ngModel)]="selectedPayement" />
            <label for="facture">Facture</label>
        </div>
        <div>
            <input type="radio" id="twint" name="payement" value="Twint" [(ngModel)]="selectedPayement" />
            <label for="twint">Twint</label>
        </div>
        <div>
            <input type="radio" id="mastercard" name="payement" value="Mastercard" [(ngModel)]="selectedPayement" />
            <label for="mastercard">Mastercard</label>
        </div>
        <div>
            <input type="radio" id="visa" name="payement" value="Visa" [(ngModel)]="selectedPayement" />
            <label for="visa">Visa</label>
        </div>
        <div>
            <input type="radio" id="amex" name="payement" value="Americain_express" [(ngModel)]="selectedPayement" />
            <label for="amex">American Express</label>
        </div>
    </div>

    <div>
        <h3>Adresse de livraison</h3>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div>
                <label for="entreprise">Entreprise</label>
                <input
                    id="entreprise"
                    type="text"
                    formControlName="entreprise"
                    autocomplete="organization"
                />
                <span *ngIf="form.get('entreprise')?.hasError('required') && form.get('entreprise')?.touched">
                    Indiquez le nom de l'entreprise
                </span>
            </div>
            <div>
                <label for="adresse">Adresse</label>
                <input
                    id="adresse"
                    type="text"
                    formControlName="adresse"
                    autocomplete="street-address"
                />
                <span *ngIf="form.get('adresse')?.hasError('required') && form.get('adresse')?.touched">
                    Indiquez l'adresse
                </span>
            </div>
            <div>
                <label for="ville">Ville</label>
                <input
                    id="ville"
                    type="text"
                    formControlName="ville"
                    autocomplete="address-level2"
                />
                <span *ngIf="form.get('ville')?.hasError('required') && form.get('ville')?.touched">
                    Indiquez la ville
                </span>
            </div>
            <div>
                <label for="NPA">NPA</label>
                <input
                    id="NPA"
                    type="text"
                    formControlName="NPA"
                    autocomplete="postal-code"
                />
                <span *ngIf="form.get('NPA')?.hasError('required') && form.get('NPA')?.touched">
                    Indiquez le code postal
                </span>
                <span *ngIf="form.get('NPA')?.hasError('pattern') && form.get('NPA')?.touched">
                    Le NPA doit contenir 4 chiffres
                </span>
            </div>

            <button type="submit" [disabled]="form.invalid">Commander</button>
            <button type="button" (click)="generateBillPDF()">Télécharger la facture</button>
        </form>
    </div>

    <app-confirmation-commande></app-confirmation-commande>
</div>
