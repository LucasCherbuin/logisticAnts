<div class="card" *ngFor="let produit of produits" class="card">
    <img class="card-img" [src]="produit.image" [alt]="produit.nom" [routerLink]="['/article', produit.id]">
    <div class="card-body" [routerLink]="['/article', produit.id]">
        <h5 class="card-nom">{{ produit.nom }}</h5>
        <p class="card-prix">{{ produit.prix | currency:'CHF' }}</p>
    </div>
    <button class="addToCart" (click)="addToCart(produit); $event.stopPropagation()">
        <i class="ph ph-shopping-cart"></i> Ajouter au panier
    </button>
</div>
