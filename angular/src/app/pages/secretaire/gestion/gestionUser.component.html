<div class="menuAdmin" >
    <select class="filtreSelect" [formControl]="filterField">
    <option value="pseudo">Nom</option>
    <option value="role">Métier</option>
    </select>
    <table class="tableAdmin">
        <thead class="theadAdmin">
            <tr>
                <th scope="col" [class.column-table-filter]="filterField.value === 'pseudo'">Nom</th>
                <th scope="col" [class.column-table-filter]="filterField.value === 'role'">Métier</th>
                <th scope="col">Action</th>
            </tr>
        </thead>
        <tbody class="tbodyAdmin">
            <tr class="filtre list-group-item"
                *ngFor="let user of filteredUser$ | async; let i = index"
                (click)="setCurrentAntrag(user, i)"
            >
                <td [class.column-table-filter]="filterField.value === 'pseudo'">{{ user.pseudo }}</td>
                <td [class.column-table-filter]="filterField.value === 'role'">{{ getRoleLabel(user) }}</td>
                <td>
                    <a class="optionUser" [routerLink]="['/secretaire-update-user', user.id]"><i class="ph ph-pencil"></i></a>
                    <button class="optionUser" (click)="deleteUser(user.id)"><i class="ph ph-x-circle"></i></button>
                </td>
            </tr>
        </tbody>
        <a class="optionUser" routerLink="/secretaire-register"><i class="ph ph-plus-circle"></i></a>
    </table>
    
</div>
