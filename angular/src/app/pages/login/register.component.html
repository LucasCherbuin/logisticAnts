
<div class="logForm" [ngClass]="(role || 'DEFAULT') + '-theme'">
    <input [(ngModel)]="pseudo" placeholder="Pseudo">
    <input [(ngModel)]="email" placeholder="Email">
    <input [(ngModel)]="password" type="password" placeholder="Password">

    <button (click)="register()">S'inscrire</button>
    <confirmation-registered #confirmationRegistered></confirmation-registered>
</div>
