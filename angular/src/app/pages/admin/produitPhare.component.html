
<div >
    <input 
        type="text" 
        [formControl]="filterfcvar" 
        placeholder="Rechercher un utilisateur..."
        class="form-control mb-3"
        />
    <table>
        <thead>
            <tr></tr>
                <th scope="col">Achat</th>
                <th scope="col">Prdouit</th>
            </tr>
        </thead>
        <tbody>
            <tr class="filtre"
            *ngFor="let produitPhare of filteredProduitPhare$ | async; let i = index"
            class="list-group-item"
            (click)="setCurrentAntrag(produitPhare, i)"
            >
                <td> {{ ProduitPhare.produit }} </td>
                <td> {{ ProduitPhare.achat }}</td>
            </tr>
        </tbody>
    </table>
</div>
